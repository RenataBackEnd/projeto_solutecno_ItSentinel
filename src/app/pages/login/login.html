<!-- ÁREA PRINCIPAL DO LOGIN -->
    <main class="pagina-login">
        <!-- CARD DE LOGIN -->
        <section class="card-login">
            <div class="logo-login">
                <h1>IT Sentinel</h1>
            </div>

            <!-- Identificação do ambiente -->
            <div class="titulo-login">
                <span>AMBIENTE PROTEGIDO</span>
                <h2>Acesso Restrito</h2>
                <p>Equipe de TI</p>
            </div>

            <!-- FORMULÁRIO DE LOGIN -->
            <!-- Removemos a tag <form> padrão para termos controlo total com o Angular -->
            <div class="formulario-login">
                
                <!-- Mensagem de Erro (Só aparece se houver erro) -->
                <div class="mensagem-erro" *ngIf="mensagemErro">
                    {{ mensagemErro }}
                </div>

                <!-- Campo de e-mail -->
                <div class="campo-login">
                    <label for="email">E-mail corporativo</label>
                    <!-- Usamos [(ngModel)] para ligar o campo à variável do TypeScript -->
                    <input type="email" id="email" [(ngModel)]="emailUsuario" placeholder="ex: seu.nome@solutecno.com.br" required>
                </div>

                <!-- Campo de senha -->
                <div class="campo-login">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" [(ngModel)]="senhaUsuario" placeholder="Mínimo 8 caracteres">
                </div>

                <!-- Botão de acesso (Agora chama a função fazerLogin em vez de usar routerLink) -->
                <button type="button" (click)="fazerLogin()" class="botao-entrar">Entrar no Dashboard</button>
            </div>

            <!-- INFORMAÇÃO SOBRE LGPD -->
            <div class="informacao-lgpd">
                <p>Seus dados são tratados de acordo com as diretrizes da Lei Geral de Proteção de Dados (LGPD).</p>
            </div>

            <!-- Voltar para a página home -->
            <a routerLink="/home" class="voltar-home">Voltar Home</a>
        </section>
    </main>
